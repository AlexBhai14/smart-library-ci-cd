name: Smart Library CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/smart-library

jobs:

  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - book-service
          - member-service
          - issue-return-service
          - api-gateway
          - frontend-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        working-directory: ${{ matrix.service }}
        run: mvn -B test

      - name: Package
        working-directory: ${{ matrix.service }}
        run: mvn -B -DskipTests package


  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package all services
        run: |
          for s in auth-service book-service member-service issue-return-service api-gateway frontend-service; do
            mvn -B -DskipTests package -f "$s/pom.xml"
          done

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          for s in auth-service book-service member-service issue-return-service api-gateway frontend-service; do
            docker build -t "$IMAGE_PREFIX:$s-${GITHUB_SHA::7}" "$s"
            docker push "$IMAGE_PREFIX:$s-${GITHUB_SHA::7}"
          done


  deploy:
    needs: docker
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Skip Kubernetes deployment
        run: echo "Kubernetes deployment skipped because the cluster is running locally on Docker Desktop"