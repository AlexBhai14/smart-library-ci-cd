name: Smart Library CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/smart-library

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - book-service
          - member-service
          - issue-return-service
          - api-gateway
          - frontend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        working-directory: ${{ matrix.service }}
        run: mvn -B test
      - name: Package
        working-directory: ${{ matrix.service }}
        run: mvn -B -DskipTests package

  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push images
        run: |
          for s in auth-service book-service member-service issue-return-service api-gateway frontend-service; do
            docker build -t "$IMAGE_PREFIX:$s-${GITHUB_SHA::7}" "$s"
            docker push "$IMAGE_PREFIX:$s-${GITHUB_SHA::7}"
          done

  deploy:
    needs: docker
    if: github.event_name == 'push' && vars.ENABLE_K8S_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Update image references
        run: |
          sed -i "s|IMAGE_PREFIX|${{ secrets.DOCKERHUB_USERNAME }}/smart-library|g" k8s/*.yaml
          sed -i "s|IMAGE_TAG|${GITHUB_SHA::7}|g" k8s/*.yaml
      - name: Deploy
        run: kubectl apply -f k8s/
