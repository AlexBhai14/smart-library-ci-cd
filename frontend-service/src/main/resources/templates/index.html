<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Library</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    :root {
        --ink: #12203c;
        --ink-soft: #3c4a68;
        --gold: #9c6b1f;
        --gold-line: #c99a4a;
        --paper: #faf8f4;
        --card: #ffffff;
        --border: #e6e1d6;
        --teal: #2f6f62;
        --teal-bg: #eaf2f0;
        --wine: #8a3b3b;
        --wine-bg: #f7ecea;
        --font-display: "Source Serif 4", Georgia, serif;
        --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
        font-family: var(--font-body);
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.5;
    }

    header {
        background: var(--ink);
        color: #fff;
        padding: 18px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header::after { content: none; }

    .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: 0.2px; }

    .brand svg { flex-shrink: 0; }

    nav { display: flex; align-items: center; gap: 4px; }

    nav a {
        color: #cfd6e6;
        margin-left: 6px;
        padding: 6px 4px;
        text-decoration: none;
        font-size: 0.88rem;
        font-weight: 500;
        border-bottom: 2px solid transparent;
        transition: color 0.15s ease, border-color 0.15s ease;
    }

    nav a:hover { color: #fff; border-color: var(--gold-line); }

    .gold-rule { height: 3px; background: linear-gradient(90deg, var(--gold-line), var(--gold) 40%, var(--ink) 100%); }

    main { padding: 0 7% 70px; max-width: 1080px; margin: 0 auto; }

    .hero {
        padding: 54px 0 30px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 32px;
        position: relative;
    }

    .hero .kicker {
        font-size: 0.78rem;
        color: var(--gold);
        font-weight: 600;
        margin: 0 0 10px;
    }

    .hero h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 2.4rem;
        line-height: 1.15;
        margin: 0 0 12px;
        color: var(--ink);
        max-width: 12ch;
    }

    .hero p {
        color: var(--ink-soft);
        margin: 0 0 26px;
        font-size: 0.98rem;
        max-width: 46ch;
    }

    .search-row {
        display: flex;
        max-width: 520px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px;
        box-shadow: 0 1px 3px rgba(18, 32, 60, 0.05);
    }

    .search-row svg { flex-shrink: 0; margin: 0 6px 0 10px; align-self: center; color: var(--ink-soft); }

    input {
        font-family: var(--font-body);
        font-size: 0.95rem;
        padding: 10px 6px;
        border: none;
        background: transparent;
        color: var(--ink);
        flex: 1;
        min-width: 0;
    }

    input:focus { outline: none; }

    button {
        font-family: var(--font-body);
        font-size: 0.9rem;
        font-weight: 500;
        padding: 10px 20px;
        border-radius: 6px;
        border: none;
        background: var(--ink);
        color: #fff;
        cursor: pointer;
        transition: background 0.15s ease;
        white-space: nowrap;
    }

    button:hover { background: var(--gold); }

    .section-label {
        font-size: 0.78rem;
        color: var(--ink-soft);
        margin: 0 0 14px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .section-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    #books {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
    }

    .card {
        background: var(--card);
        padding: 20px 20px 18px;
        border-radius: 4px 8px 8px 4px;
        border: 1px solid var(--border);
        border-left: 4px solid var(--gold-line);
        box-shadow: 0 1px 2px rgba(18, 32, 60, 0.04);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(18, 32, 60, 0.08); }

    #books .card:nth-child(4n+2) { border-left-color: var(--teal); }
    #books .card:nth-child(4n+3) { border-left-color: var(--wine); }
    #books .card:nth-child(4n+4) { border-left-color: var(--ink); }

    .card h2 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.08rem;
        margin: 0 0 8px;
        color: var(--ink);
        line-height: 1.3;
    }

    .card p {
        margin: 3px 0;
        font-size: 0.85rem;
        color: var(--ink-soft);
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 4px 10px 4px 8px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 600;
    }

    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }

    .status.available { background: var(--teal-bg); color: var(--teal); }
    .status.available::before { background: var(--teal); }

    .status.issued { background: var(--wine-bg); color: var(--wine); }
    .status.issued::before { background: var(--wine); }

    #books > p { color: var(--ink-soft); grid-column: 1 / -1; font-size: 0.92rem; padding: 20px 0; }
</style></head>
<body>

<header>
    <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4.5C4 3.67 4.67 3 5.5 3H11V19H5.5C4.67 19 4 19.67 4 20.5V4.5Z" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M20 4.5C20 3.67 19.33 3 18.5 3H13V19H18.5C19.33 19 20 19.67 20 20.5V4.5Z" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Smart Library
    </div>
    <nav><a href="/">Books</a><a href="/admin">Admin Login</a></nav>
</header>
<div class="gold-rule"></div>

<main>
    <section class="hero">
        <p class="kicker">Public catalog</p>
        <h1>Find your next book</h1>
        <p>Search the catalog by title or author and check what's available right now. No sign-in needed.</p>
        <div class="search-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/>
                <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input id="q" placeholder="Search by title or author">
            <button onclick="loadBooks()">Search</button>
        </div>
    </section>

    <p class="section-label">Catalog</p>
    <div id="books">Loading...</div>
</main>

<script>
async function loadBooks(){const q=document.getElementById('q').value;const r=await fetch('/api/books'+(q?'?q='+encodeURIComponent(q):''));const data=await r.json();
document.getElementById('books').innerHTML=data.map(b=>`<div class="card"><h2>${b.title}</h2><p>Author: ${b.author}</p><p>Category: ${b.category||'-'}</p><p>Available: ${b.availableQuantity}/${b.quantity}</p><span class="status ${b.availableQuantity>0?'available':'issued'}">${b.availableQuantity>0?'Available':'Issued'}</span></div>`).join('')||'<p>No books found.</p>'}
loadBooks();
</script></body></html>
