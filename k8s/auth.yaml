apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, namespace: smart-library}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
        - name: auth-service
          image: smart-library-cnd-auth-service:latest
          ports:
            - containerPort: 8092
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://auth-db:5432/authdb
            - name: SPRING_DATASOURCE_USERNAME
              value: library
            - name: SPRING_DATASOURCE_PASSWORD
              value: library
---
apiVersion: v1
kind: Service
metadata: {name: auth-service, namespace: smart-library}
spec:
  selector: {app: auth-service}
  ports: [{port: 8092, targetPort: 8092}]
