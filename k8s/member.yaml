apiVersion: apps/v1
kind: Deployment
metadata: {name: member-service, namespace: smart-library}
spec:
  replicas: 1
  selector: {matchLabels: {app: member-service}}
  template:
    metadata: {labels: {app: member-service}}
    spec:
      containers:
        - name: member-service
          image: smart-library-cnd-member-service:latest
          ports:
            - containerPort: 8094
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://member-db:5432/memberdb
            - name: SPRING_DATASOURCE_USERNAME
              value: library
            - name: SPRING_DATASOURCE_PASSWORD
              value: library
---
apiVersion: v1
kind: Service
metadata: {name: member-service, namespace: smart-library}
spec:
  selector: {app: member-service}
  ports: [{port: 8094, targetPort: 8094}]
