apiVersion: apps/v1
kind: Deployment
metadata: {name: book-service, namespace: smart-library}
spec:
  replicas: 1
  selector: {matchLabels: {app: book-service}}
  template:
    metadata: {labels: {app: book-service}}
    spec:
      containers:
        - name: book-service
          image: smart-library-cnd-book-service:latest
          ports:
            - containerPort: 8093
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://book-db:5432/bookdb
            - name: SPRING_DATASOURCE_USERNAME
              value: library
            - name: SPRING_DATASOURCE_PASSWORD
              value: library
---
apiVersion: v1
kind: Service
metadata: {name: book-service, namespace: smart-library}
spec:
  selector: {app: book-service}
  ports: [{port: 8093, targetPort: 8093}]
