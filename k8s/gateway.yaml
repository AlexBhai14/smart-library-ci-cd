apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: smart-library-cnd-api-gateway:latest
          ports:
            - containerPort: 8091
          env:
            - name: AUTH_URL
              value: "http://auth-service:8092"
            - name: BOOK_URL
              value: "http://book-service:8093"
            - name: MEMBER_URL
              value: "http://member-service:8094"
            - name: ISSUE_URL
              value: "http://issue-return-service:8095"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-library
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8091
      targetPort: 8091