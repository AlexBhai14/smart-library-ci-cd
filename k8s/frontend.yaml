apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend-service, namespace: smart-library}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend-service}}
  template:
    metadata: {labels: {app: frontend-service}}
    spec:
      containers:
        - name: frontend-service
          image: smart-library-cnd-frontend-service:latest
          ports: [{containerPort: 8090}]
---
apiVersion: v1
kind: Service
metadata: {name: library-frontend, namespace: smart-library}
spec:
  type: NodePort
  selector: {app: frontend-service}
  ports: [{port: 8090, targetPort: 8090, nodePort: 30090}]
